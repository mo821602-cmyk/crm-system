<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - CRM</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f1923; color: #e0e0e0; min-height: 100vh; }
        
        /* Sidebar */
        .sidebar {
            position: fixed; right: 0; top: 0; width: 240px; height: 100vh;
            background: #1a2332; border-left: 1px solid #2a3a4a; padding: 20px 0; z-index: 100;
        }
        .sidebar-logo { text-align: center; padding: 15px; border-bottom: 1px solid #2a3a4a; margin-bottom: 20px; }
        .sidebar-logo h2 { color: #4fc3f7; font-size: 1.3em; }
        .nav-item {
            padding: 12px 25px; cursor: pointer; transition: all 0.3s;
            display: flex; align-items: center; gap: 10px; color: #90a4ae;
        }
        .nav-item:hover, .nav-item.active { background: rgba(79,195,247,0.1); color: #4fc3f7; border-left: 3px solid #4fc3f7; }
        .nav-item span { font-size: 1.2em; }
        
        /* Main Content */
        .main { margin-right: 240px; padding: 25px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .header h1 { font-size: 1.6em; color: #fff; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .user-info span { color: #90a4ae; }
        .btn-logout { padding: 8px 16px; background: rgba(244,67,54,0.2); color: #ef5350; border: 1px solid #ef5350; border-radius: 8px; cursor: pointer; }
        
        /* Stats Cards */
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card {
            background: linear-gradient(135deg, #1a2332, #243447);
            border: 1px solid #2a3a4a; border-radius: 12px; padding: 20px;
        }
        .stat-card .label { color: #78909c; font-size: 0.85em; margin-bottom: 8px; }
        .stat-card .value { font-size: 1.8em; font-weight: 700; color: #4fc3f7; }
        .stat-card .sub { color: #66bb6a; font-size: 0.8em; margin-top: 5px; }
        
        /* Sections */
        .section { display: none; }
        .section.active { display: block; }
        
        /* Tables */
        .table-container { background: #1a2332; border-radius: 12px; border: 1px solid #2a3a4a; overflow: hidden; }
        .table-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-bottom: 1px solid #2a3a4a; }
        .table-header h3 { color: #fff; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #243447; padding: 12px 15px; text-align: right; color: #90a4ae; font-size: 0.85em; }
        td { padding: 12px 15px; border-bottom: 1px solid #2a3a4a; }
        tr:hover { background: rgba(79,195,247,0.05); }
        
        /* Buttons */
        .btn-primary { padding: 8px 18px; background: #4fc3f7; color: #1a1a2e; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.9em; }
        .btn-primary:hover { background: #29b6f6; }
        .btn-sm { padding: 5px 12px; font-size: 0.8em; border-radius: 6px; cursor: pointer; border: none; }
        .btn-edit { background: rgba(255,193,7,0.2); color: #ffc107; }
        .btn-delete { background: rgba(244,67,54,0.2); color: #ef5350; }
        .btn-success { background: rgba(76,175,80,0.2); color: #66bb6a; }
        
        /* Badge */
        .badge { padding: 4px 10px; border-radius: 12px; font-size: 0.75em; font-weight: 600; }
        .badge-green { background: rgba(76,175,80,0.2); color: #66bb6a; }
        .badge-blue { background: rgba(79,195,247,0.2); color: #4fc3f7; }
        .badge-orange { background: rgba(255,152,0,0.2); color: #ffa726; }
        .badge-red { background: rgba(244,67,54,0.2); color: #ef5350; }
        .badge-purple { background: rgba(156,39,176,0.2); color: #ba68c8; }
        
        /* Modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 200; align-items: center; justify-content: center; }
        .modal-overlay.show { display: flex; }
        .modal { background: #1a2332; border-radius: 16px; padding: 30px; width: 90%; max-width: 500px; border: 1px solid #2a3a4a; }
        .modal h3 { color: #fff; margin-bottom: 20px; }
        .modal .form-group { margin-bottom: 15px; }
        .modal label { display: block; color: #90a4ae; margin-bottom: 5px; font-size: 0.9em; }
        .modal input, .modal select, .modal textarea {
            width: 100%; padding: 10px 12px; background: #0f1923; border: 1px solid #2a3a4a;
            border-radius: 8px; color: #fff; font-size: 0.95em;
        }
        .modal textarea { height: 80px; resize: vertical; }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .btn-cancel { padding: 10px 20px; background: #2a3a4a; color: #90a4ae; border: none; border-radius: 8px; cursor: pointer; }
        
        /* Pipeline */
        .pipeline { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 15px; }
        .pipeline-stage { background: #1a2332; border: 1px solid #2a3a4a; border-radius: 10px; padding: 15px; min-height: 150px; }
        .pipeline-stage h4 { color: #4fc3f7; font-size: 0.85em; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid #2a3a4a; }
        .pipeline-deal { background: #243447; border-radius: 8px; padding: 10px; margin-bottom: 8px; font-size: 0.85em; }
        .pipeline-deal .deal-value { color: #66bb6a; font-weight: 600; }
        
        /* Search */
        .search-box { display: flex; gap: 10px; margin-bottom: 15px; }
        .search-box input { flex: 1; padding: 10px 15px; background: #0f1923; border: 1px solid #2a3a4a; border-radius: 8px; color: #fff; }
        
        /* Activities */
        .activity-item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid #2a3a4a; }
        .activity-icon { width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.9em; }
        .activity-content { flex: 1; }
        .activity-content p { font-size: 0.9em; }
        .activity-content small { color: #78909c; }
        
        /* Responsive */
        @media (max-width: 768px) {
            .sidebar { width: 60px; }
            .sidebar-logo h2, .nav-item p { display: none; }
            .main { margin-right: 60px; }
            .stats { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-logo"><h2>📊 CRM</h2></div>
        <div class="nav-item active" onclick="showSection('overview')"><span>🏠</span><p>نظرة عامة</p></div>
        <div class="nav-item" onclick="showSection('customers')"><span>👥</span><p>العملاء</p></div>
        <div class="nav-item" onclick="showSection('deals')"><span>💰</span><p>الصفقات</p></div>
        <div class="nav-item" onclick="showSection('tasks')"><span>✅</span><p>المهام</p></div>
        <div class="nav-item" onclick="showSection('reports')"><span>📈</span><p>التقارير</p></div>
    </div>

    <div class="main">
        <div class="header">
            <h1 id="pageTitle">نظرة عامة</h1>
            <div class="user-info">
                <span id="userName"></span>
                <button class="btn-logout" onclick="logout()">خروج</button>
            </div>
        </div>

        <!-- Overview Section -->
        <div class="section active" id="sec-overview">
            <div class="stats" id="statsContainer"></div>
            <div class="table-container" style="margin-top:20px; padding:20px;">
                <h3 style="margin-bottom:15px;">آخر النشاطات</h3>
                <div id="activitiesList"></div>
            </div>
        </div>

        <!-- Customers Section -->
        <div class="section" id="sec-customers">
            <div class="search-box">
                <input type="text" id="customerSearch" placeholder="بحث عن عميل..." oninput="searchCustomers()">
                <button class="btn-primary" onclick="openModal('customer')">+ إضافة عميل</button>
            </div>
            <div class="table-container">
                <table>
                    <thead><tr><th>الاسم</th><th>البريد</th><th>الهاتف</th><th>الشركة</th><th>التصنيف</th><th>الحالة</th><th>إجراءات</th></tr></thead>
                    <tbody id="customersTable"></tbody>
                </table>
            </div>
        </div>

        <!-- Deals Section -->
        <div class="section" id="sec-deals">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;">
                <h3>خط المبيعات (Pipeline)</h3>
                <button class="btn-primary" onclick="openModal('deal')">+ صفقة جديدة</button>
            </div>
            <div class="pipeline" id="pipelineContainer"></div>
        </div>

        <!-- Tasks Section -->
        <div class="section" id="sec-tasks">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;">
                <h3>المهام</h3>
                <button class="btn-primary" onclick="openModal('task')">+ مهمة جديدة</button>
            </div>
            <div class="table-container">
                <table>
                    <thead><tr><th>المهمة</th><th>العميل</th><th>الأولوية</th><th>الموعد</th><th>الحالة</th><th>إجراءات</th></tr></thead>
                    <tbody id="tasksTable"></tbody>
                </table>
            </div>
        </div>

        <!-- Reports Section -->
        <div class="section" id="sec-reports">
            <div class="stats" id="reportStats"></div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:20px;">
                <div class="table-container" style="padding:20px;">
                    <h3 style="margin-bottom:15px;">تقرير المبيعات</h3>
                    <div id="salesReport"></div>
                </div>
                <div class="table-container" style="padding:20px;">
                    <h3 style="margin-bottom:15px;">تقرير العملاء</h3>
                    <div id="customerReport"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h3 id="modalTitle"></h3>
            <form id="modalForm"></form>
        </div>
    </div>

    <script>
        const API = '';
        const token = localStorage.getItem('crm_token');
        const user = JSON.parse(localStorage.getItem('crm_user') || '{}');
        
        if (!token) window.location.href = '/';
        document.getElementById('userName').textContent = user.fullName || user.username || '';

        const headers = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token };

        function logout() { localStorage.clear(); window.location.href = '/'; }

        function showSection(name) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById('sec-' + name).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            event.currentTarget.classList.add('active');
            const titles = { overview: 'نظرة عامة', customers: 'العملاء', deals: 'الصفقات', tasks: 'المهام', reports: 'التقارير' };
            document.getElementById('pageTitle').textContent = titles[name];
            if (name === 'overview') loadDashboard();
            if (name === 'customers') loadCustomers();
            if (name === 'deals') loadDeals();
            if (name === 'tasks') loadTasks();
            if (name === 'reports') loadReports();
        }

        // ===== DASHBOARD =====
        async function loadDashboard() {
            try {
                const res = await fetch(API + '/api/reports/dashboard', { headers });
                const data = await res.json();
                if (!data.success) return;
                const s = data.stats;
                document.getElementById('statsContainer').innerHTML = `
                    <div class="stat-card"><div class="label">إجمالي العملاء</div><div class="value">${s.totalCustomers}</div><div class="sub">${s.activeCustomers} نشط</div></div>
                    <div class="stat-card"><div class="label">الصفقات</div><div class="value">${s.totalDeals}</div><div class="sub">${s.wonDeals} مكتملة</div></div>
                    <div class="stat-card"><div class="label">الإيرادات</div><div class="value">${s.totalRevenue.toLocaleString()}</div><div class="sub">ر.س</div></div>
                    <div class="stat-card"><div class="label">المهام المعلقة</div><div class="value">${s.pendingTasks}</div><div class="sub">${s.overdueTasks} متأخرة</div></div>
                    <div class="stat-card"><div class="label">معدل التحويل</div><div class="value">${s.conversionRate}%</div></div>
                `;
                const acts = data.recentActivities || [];
                document.getElementById('activitiesList').innerHTML = acts.length === 0 ? '<p style="color:#78909c">لا توجد نشاطات بعد</p>' :
                    acts.map(a => `<div class="activity-item"><div class="activity-icon" style="background:rgba(79,195,247,0.2)">📌</div><div class="activity-content"><p>${a.description || a.type}</p><small>${new Date(a.createdAt).toLocaleDateString('ar')}</small></div></div>`).join('');
            } catch(e) { console.error(e); }
        }

        // ===== CUSTOMERS =====
        let allCustomers = [];
        async function loadCustomers() {
            const res = await fetch(API + '/api/customers', { headers });
            const data = await res.json();
            allCustomers = data.customers || [];
            renderCustomers(allCustomers);
        }
        function renderCustomers(list) {
            document.getElementById('customersTable').innerHTML = list.length === 0 ? '<tr><td colspan="7" style="text-align:center;color:#78909c">لا يوجد عملاء</td></tr>' :
                list.map(c => `<tr>
                    <td><strong>${c.name}</strong></td><td>${c.email||'-'}</td><td>${c.phone||'-'}</td><td>${c.company||'-'}</td>
                    <td><span class="badge badge-blue">${c.category}</span></td>
                    <td><span class="badge ${c.status==='نشط'?'badge-green':'badge-orange'}">${c.status}</span></td>
                    <td><button class="btn-sm btn-delete" onclick="deleteCustomer(${c.id})">حذف</button></td>
                </tr>`).join('');
        }
        function searchCustomers() {
            const q = document.getElementById('customerSearch').value.toLowerCase();
            renderCustomers(allCustomers.filter(c => c.name.toLowerCase().includes(q) || (c.email||'').toLowerCase().includes(q) || (c.phone||'').includes(q)));
        }
        async function deleteCustomer(id) {
            if (!confirm('حذف هذا العميل؟')) return;
            await fetch(API + '/api/customers/' + id, { method: 'DELETE', headers });
            loadCustomers();
        }

        // ===== DEALS =====
        async function loadDeals() {
            const res = await fetch(API + '/api/deals/pipeline/summary', { headers });
            const data = await res.json();
            const dealsRes = await fetch(API + '/api/deals', { headers });
            const dealsData = await dealsRes.json();
            const deals = dealsData.deals || [];
            
            const stages = data.pipeline || [];
            document.getElementById('pipelineContainer').innerHTML = stages.map(s => `
                <div class="pipeline-stage">
                    <h4>${s.stage} (${s.count})</h4>
                    ${deals.filter(d=>d.stage===s.stage).map(d => `
                        <div class="pipeline-deal">
                            <div>${d.title}</div>
                            <div class="deal-value">${d.value?.toLocaleString() || 0} ر.س</div>
                            <small style="color:#78909c">${d.customerName||''}</small>
                        </div>
                    `).join('')}
                </div>
            `).join('');
        }

        // ===== TASKS =====
        async function loadTasks() {
            const res = await fetch(API + '/api/tasks', { headers });
            const data = await res.json();
            const tasks = data.tasks || [];
            const priorityBadge = p => p==='عالية'?'badge-red':p==='متوسطة'?'badge-orange':'badge-green';
            const statusBadge = s => s==='مكتملة'?'badge-green':s==='جارية'?'badge-blue':'badge-orange';
            document.getElementById('tasksTable').innerHTML = tasks.length === 0 ? '<tr><td colspan="6" style="text-align:center;color:#78909c">لا توجد مهام</td></tr>' :
                tasks.map(t => `<tr>
                    <td>${t.title}</td><td>${t.customerName||'-'}</td>
                    <td><span class="badge ${priorityBadge(t.priority)}">${t.priority}</span></td>
                    <td>${t.dueDate||'-'}</td>
                    <td><span class="badge ${statusBadge(t.status)}">${t.status}</span></td>
                    <td>
                        ${t.status!=='مكتملة'?`<button class="btn-sm btn-success" onclick="completeTask(${t.id})">✓</button>`:''} 
                        <button class="btn-sm btn-delete" onclick="deleteTask(${t.id})">حذف</button>
                    </td>
                </tr>`).join('');
        }
        async function completeTask(id) {
            await fetch(API + '/api/tasks/' + id + '/status', { method: 'PATCH', headers, body: JSON.stringify({status:'مكتملة'}) });
            loadTasks();
        }
        async function deleteTask(id) {
            if (!confirm('حذف هذه المهمة؟')) return;
            await fetch(API + '/api/tasks/' + id, { method: 'DELETE', headers });
            loadTasks();
        }

        // ===== REPORTS =====
        async function loadReports() {
            const [salesRes, custRes] = await Promise.all([
                fetch(API + '/api/reports/sales', { headers }),
                fetch(API + '/api/reports/customers', { headers })
            ]);
            const sales = await salesRes.json();
            const cust = await custRes.json();
            
            if (sales.success) {
                const r = sales.report;
                document.getElementById('reportStats').innerHTML = `
                    <div class="stat-card"><div class="label">إجمالي الصفقات</div><div class="value">${r.totalDeals}</div></div>
                    <div class="stat-card"><div class="label">القيمة الإجمالية</div><div class="value">${r.totalValue.toLocaleString()}</div></div>
                    <div class="stat-card"><div class="label">الإيرادات المحققة</div><div class="value">${r.wonValue.toLocaleString()}</div></div>
                    <div class="stat-card"><div class="label">متوسط قيمة الصفقة</div><div class="value">${r.avgDealValue.toLocaleString()}</div></div>
                `;
                document.getElementById('salesReport').innerHTML = Object.entries(r.byStage||{}).map(([k,v]) => 
                    `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #2a3a4a"><span>${k}</span><span>${v.count} صفقة - ${v.value.toLocaleString()} ر.س</span></div>`
                ).join('') || '<p style="color:#78909c">لا توجد بيانات</p>';
            }
            if (cust.success) {
                const r = cust.report;
                document.getElementById('customerReport').innerHTML = `
                    <div style="margin-bottom:15px"><strong>إجمالي العملاء:</strong> ${r.totalCustomers}</div>
                    <div style="margin-bottom:10px"><strong>حسب التصنيف:</strong></div>
                    ${Object.entries(r.byCategory||{}).map(([k,v]) => `<div style="display:flex;justify-content:space-between;padding:5px 0"><span>${k}</span><span>${v}</span></div>`).join('')}
                    <div style="margin-top:15px;margin-bottom:10px"><strong>حسب الحالة:</strong></div>
                    ${Object.entries(r.byStatus||{}).map(([k,v]) => `<div style="display:flex;justify-content:space-between;padding:5px 0"><span>${k}</span><span>${v}</span></div>`).join('')}
                ` || '<p style="color:#78909c">لا توجد بيانات</p>';
            }
        }

        // ===== MODALS =====
        function openModal(type) {
            const overlay = document.getElementById('modalOverlay');
            const title = document.getElementById('modalTitle');
            const form = document.getElementById('modalForm');
            overlay.classList.add('show');
            
            if (type === 'customer') {
                title.textContent = 'إضافة عميل جديد';
                form.innerHTML = `
                    <div class="form-group"><label>الاسم *</label><input id="m_name" required></div>
                    <div class="form-group"><label>البريد</label><input id="m_email" type="email"></div>
                    <div class="form-group"><label>الهاتف</label><input id="m_phone"></div>
                    <div class="form-group"><label>الشركة</label><input id="m_company"></div>
                    <div class="form-group"><label>التصنيف</label><select id="m_category"><option>عميل جديد</option><option>عميل محتمل</option><option>عميل دائم</option><option>عميل VIP</option></select></div>
                    <div class="form-group"><label>القيمة المتوقعة</label><input id="m_value" type="number" value="0"></div>
                    <div class="form-group"><label>ملاحظات</label><textarea id="m_notes"></textarea></div>
                    <div class="modal-actions"><button type="button" class="btn-primary" onclick="saveCustomer()">حفظ</button><button type="button" class="btn-cancel" onclick="closeModal()">إلغاء</button></div>
                `;
            } else if (type === 'deal') {
                title.textContent = 'صفقة جديدة';
                const opts = allCustomers.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
                form.innerHTML = `
                    <div class="form-group"><label>العنوان *</label><input id="m_title" required></div>
                    <div class="form-group"><label>العميل</label><select id="m_customerId"><option value="">-- اختر --</option>${opts}</select></div>
                    <div class="form-group"><label>القيمة</label><input id="m_dealValue" type="number" value="0"></div>
                    <div class="form-group"><label>المرحلة</label><select id="m_stage"><option>تواصل أولي</option><option>عرض سعر</option><option>تفاوض</option><option>مراجعة</option></select></div>
                    <div class="form-group"><label>تاريخ الإغلاق المتوقع</label><input id="m_closeDate" type="date"></div>
                    <div class="form-group"><label>ملاحظات</label><textarea id="m_dealNotes"></textarea></div>
                    <div class="modal-actions"><button type="button" class="btn-primary" onclick="saveDeal()">حفظ</button><button type="button" class="btn-cancel" onclick="closeModal()">إلغاء</button></div>
                `;
            } else if (type === 'task') {
                const opts = allCustomers.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
                title.textContent = 'مهمة جديدة';
                form.innerHTML = `
                    <div class="form-group"><label>العنوان *</label><input id="m_taskTitle" required></div>
                    <div class="form-group"><label>الوصف</label><textarea id="m_taskDesc"></textarea></div>
                    <div class="form-group"><label>العميل</label><select id="m_taskCustomer"><option value="">-- اختر --</option>${opts}</select></div>
                    <div class="form-group"><label>الأولوية</label><select id="m_priority"><option>منخفضة</option><option selected>متوسطة</option><option>عالية</option></select></div>
                    <div class="form-group"><label>الموعد النهائي</label><input id="m_dueDate" type="date"></div>
                    <div class="modal-actions"><button type="button" class="btn-primary" onclick="saveTask()">حفظ</button><button type="button" class="btn-cancel" onclick="closeModal()">إلغاء</button></div>
                `;
            }
        }
        function closeModal() { document.getElementById('modalOverlay').classList.remove('show'); }

        async function saveCustomer() {
            const body = {
                name: document.getElementById('m_name').value,
                email: document.getElementById('m_email').value,
                phone: document.getElementById('m_phone').value,
                company: document.getElementById('m_company').value,
                category: document.getElementById('m_category').value,
                value: parseFloat(document.getElementById('m_value').value) || 0,
                notes: document.getElementById('m_notes').value
            };
            if (!body.name) return alert('الاسم مطلوب');
            await fetch(API + '/api/customers', { method: 'POST', headers, body: JSON.stringify(body) });
            closeModal(); loadCustomers();
        }

        async function saveDeal() {
            const body = {
                title: document.getElementById('m_title').value,
                customerId: document.getElementById('m_customerId').value || null,
                value: parseFloat(document.getElementById('m_dealValue').value) || 0,
                stage: document.getElementById('m_stage').value,
                expectedCloseDate: document.getElementById('m_closeDate').value,
                notes: document.getElementById('m_dealNotes').value
            };
            if (!body.title) return alert('العنوان مطلوب');
            await fetch(API + '/api/deals', { method: 'POST', headers, body: JSON.stringify(body) });
            closeModal(); loadDeals();
        }

        async function saveTask() {
            const body = {
                title: document.getElementById('m_taskTitle').value,
                description: document.getElementById('m_taskDesc').value,
                customerId: document.getElementById('m_taskCustomer').value || null,
                priority: document.getElementById('m_priority').value,
                dueDate: document.getElementById('m_dueDate').value
            };
            if (!body.title) return alert('العنوان مطلوب');
            await fetch(API + '/api/tasks', { method: 'POST', headers, body: JSON.stringify(body) });
            closeModal(); loadTasks();
        }

        // Initial load
        loadDashboard();
    </script>
</body>
</html>
